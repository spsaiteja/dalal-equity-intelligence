<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Icon Core Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- Subtle Inner Grid Lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="260" x2="432" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="340" x2="432" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Area under chart -->
  <path d="M 96 360 L 160 300 L 230 330 L 320 210 L 416 140 L 416 380 L 96 380 Z" fill="url(#areaGrad)" />

  <!-- Trending Chart Line with Glow -->
  <path d="M 96 360 L 160 300 L 230 330 L 320 210 L 416 140" fill="none" stroke="url(#chartGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Arrow Head at the top right -->
  <polyline points="350 140 416 140 416 206" fill="none" stroke="#60A5FA" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Key Chart Points -->
  <circle cx="160" cy="300" r="10" fill="#38BDF8" />
  <circle cx="230" cy="330" r="10" fill="#60A5FA" />
  <circle cx="320" cy="210" r="12" fill="#818CF8" />
  <circle cx="416" cy="140" r="14" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Sparkle Institutional Accent -->
  <path d="M 120 150 Q 130 160 130 170 Q 130 160 140 150 Q 130 140 130 130 Q 130 140 120 150 Z" fill="#38BDF8" opacity="0.8" />
  <path d="M 270 110 Q 278 118 278 126 Q 278 118 286 110 Q 278 102 278 94 Q 278 102 270 110 Z" fill="#818CF8" opacity="0.8" />
</svg>

